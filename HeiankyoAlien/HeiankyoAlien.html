<!DOCTYPE html>
<html>
    <head>
        <base target="_top">
        <meta name="viewport" content="width=device-width">
        <meta charset="UTF-8">
        <title>平安京エイリアン</title>
        <!-- CSS -->
        <link type="text/css" rel="stylesheet" href="./HeiankyoAlien.css">
    </head>
<body>
    <table id="main_table">
        <tr>
            <td id="title">
                <!-- <span id="checkmap"></span> -->
                <span id="title_line">
                    【<ruby>平安京<rt>へいあんきょう</rt></ruby>エイリアン】
                </span>
                <br><br>
                <span>
                    <button class="transition_button" onclick='window.open("./HeiankyoAlienHelp.html")'><ruby>遊<rt>あそ</rt></ruby>び<ruby>方<rt>かた</rt></ruby></button>
                </span>
            </td>
        </tr>
        <tr>
            <td id="number">
                <!-- <label>1～50までの数字をいれてください。<input type="number" id="dataNumber" value="1" min="1" max="50"></label> -->
                <label>&emsp;<ruby>問題<rt>もんだい</rt></ruby>を<ruby>選<rt>えら</rt></ruby>んでください。
                    <select id="dataNumber">
                        <option value="1" selected>1</option>
                    </select>
                </label>
            </td>
        </tr>
        <tr>
            <td>
                <button id="start" class="menu_button" type="button" value="START"><ruby>START<rt>すたーと</rt></ruby></button>
                <button id="reset" class="menu_button" type="button" value="RESET"><ruby>RESET<rt>りせっと</rt></ruby></button>
            </td>
            <!--
            <td>
                <button id="check" class="menu_button" type="button" value="CHECK"><ruby>CHECK<rt>チェック</rt></ruby></button>
            </td>
            -->
        </tr>
        <tr>
            <td>
                <span id="scoreText"></span>
                &emsp;
                <span id="playerCountText"></span>
            </td>
        </tr>
    </table>
    <div id="gameoverImage"></div>
    <div id="clearImage"></div>
    <div id="mainScreen"></div>
    <table id="sub_table">
        <tr>
            <td>
                <button id="lbtn" class="menu_button" type="button" value="←"><img src="../img/w.png"></button>
                <button id="ubtn" class="menu_button" type="button" value="↑"><img src="../img/n.png"></button>
                <button id="dbtn" class="menu_button" type="button" value="↓"><img src="../img/s.png"></button>
                <button id="rbtn" class="menu_button" type="button" value="→"><img src="../img/e.png"></button>
            </td>
        </tr>
        <tr>
            <td>
                <button id="dig" class="menu_button" type="button" value="DIG" style="font-size: small;"><ruby>掘<rt>ほ</rt></ruby>る</button>
                <button id="bury" class="menu_button" type="button" value="BURY" style="font-size: small;"><ruby>埋<rt>う</rt></ruby>める</button>
                <button id="turnright" class="menu_button" type="button" value="RIGHT" style="font-size: small;"><ruby>右回<rt>みぎまわ</rt></ruby>り</button>
                <button id="turnleft" class="menu_button" type="button" value="LEFT" style="font-size: xx-small;"><ruby>左回<rt>ひだりまわ</rt></ruby>り</button>
            </td>
        </tr>
    </table>

    <!-- JavaScript -->
    <script type="text/javascript" src="./HeiankyoAlienData.js"></script>
    <script type="text/javascript" src="./HeiankyoAlien.js"></script>
</body>
</html>
