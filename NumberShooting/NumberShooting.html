<!DOCTYPE html>
<html>
    <head>
        <base target="_top">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta charset="UTF-8">
        <title>数字シューティング</title>
        <!-- CSS -->
        <link type="text/css" rel="stylesheet" href="./NumberShooting.css">
    </head>
    <body>
        <table id="main_table">
            <tr>
                <td id="title">
                    <span id="checkmap"></span>
                    <span id="title_line">
                        【数字シューティング】
                    </span>
                    <br><br>
                    <div class="top-button-container">
                        <button class="transition_button" onclick='window.open("./NumberShootingHelp.html")'>
                            <ruby>遊<rt>あそ</rt></ruby>び<ruby>方<rt>かた</rt></ruby>
                        </button>
                        <button id="retry" class="transition_button" value="RETRY">RETRY</button>
                    </div>
                </td>
            </tr>
        </table>
        <canvas id="mainScreen" width="750" height="800"></canvas>
        <!-- mainScreen Canvas の直下に追加 -->
        <div id="touch-keyboard">
            <div class="key-row">
                <button class="num-key" data-key="7">7</button>
                <button class="num-key" data-key="8">8</button>
                <button class="num-key" data-key="9">9</button>
            </div>
            <div class="key-row">
                <button class="num-key" data-key="4">4</button>
                <button class="num-key" data-key="5">5</button>
                <button class="num-key" data-key="6">6</button>
            </div>
            <div class="key-row">
                <button class="num-key" data-key="1">1</button>
                <button class="num-key" data-key="2">2</button>
                <button class="num-key" data-key="3">3</button>
            </div>
            <div class="key-row">
                <button class="num-key key-zero" data-key="0">0</button>
                <!--<button id="retry" class="num-key key-zero" type="button" value="RETRY">RETRY</button>-->
            </div>
            <button id="resetHighScoreBtn">ハイスコアリセット</button>
        </div>
        <!-- JavaScript -->
        <script type="text/javascript" src="./NumberShooting.js"></script>
    </body>
</html>
