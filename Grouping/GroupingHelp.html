<!DOCTYPE html>
<html>
<head>

    <!-- JavaScript -->
    <script type="text/javascript">
    </script>
</head>
<body>
    <table id="main_table">
        <tr>
            <td id="title">
                <span id="title_line">【グルーピング】</span>
            </td>
        </tr>
        <tr>
            <td id="explanation">
                すべてのマスを１～５の<ruby>数字<rt>すうじ</rt></ruby>がひとつずつ<ruby>入<rt>はい</rt></ruby>ったグループ（<ruby>同<rt>おな</rt></ruby>じ<ruby>色<rt>いろ</rt></ruby>）に<ruby>分<rt>わ</rt></ruby>けましょう。<br>
                <img src="../img/gp.png"><br>
                ・マスをクリック（タップ）すると<ruby>色<rt>いろ</rt></ruby>が<ruby>付<rt>つ</rt></ruby>きます。<br>
                ・<ruby>同<rt>おな</rt></ruby>じグループ（<ruby>同<rt>おな</rt></ruby>じ<ruby>色<rt>いろ</rt></ruby>）の１～５の<ruby>数字<rt>すうじ</rt></ruby>は、マス<ruby>同士<rt>どうし</rt></ruby>が<ruby>隣<rt>とな</rt></ruby>り<ruby>合<rt>あ</rt></ruby>っていなければなりません。<br>
                ・<ruby>黒<rt>くろ</rt></ruby>いマスは<ruby>選択<rt>せんたく</rt></ruby>できません。<br>
                ・[<ruby>RESET<rt>りせっと</rt></ruby>]ボタンをクリック（タップ）すると<ruby>最初<rt>さいしょ</rt></ruby>からやり<ruby>直<rt>なお</rt></ruby>す<ruby>事<rt>こと</rt></ruby>ができます。<br>
                ・[<ruby>UNDO<rt>あんどぅ</rt></ruby>]ボタンをクリック（タップ）するとひとつ<ruby>前<rt>まえ</rt></ruby>の<ruby>状態<rt>じょうたい</rt></ruby>に<ruby>戻<rt>もど</rt></ruby>す<ruby>事<rt>こと</rt></ruby>ができます。<br><br>
                <button class="transition_button" onclick='window.close()'><ruby>閉<rt>と</rt></ruby>じる</button>
            </td>
        </tr>
    </table>
</body>
</html>
