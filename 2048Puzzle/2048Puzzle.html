<!DOCTYPE html>
<html>
    <head>
        <base target="_top">
        <meta name="viewport" content="width=device-width">
        <meta charset="UTF-8">
        <title>2048パズル</title>
        <!-- CSS -->
        <link type="text/css" rel="stylesheet" href="./2048Puzzle.css">
    </head>
<body>
    <table id="main_table">
        <tr>
            <td id="title">
                <span id="title_line">
                    【2048パズル】
                </span>
                <br><br>
                <span>
                    <button class="transition_button" onclick='window.open("./2048PuzzleHelp.html")'><ruby>遊<rt>あそ</rt></ruby>び<ruby>方<rt>かた</rt></ruby></button>
                </span>
            </td>
        </tr>
        <tr>
            <td>
                <button id="lbtn" class="menu_button" type="button" value="←"><img src="../img/w.png"></button>
                <button id="ubtn" class="menu_button" type="button" value="↑"><img src="../img/n.png"></button>
                <button id="dbtn" class="menu_button" type="button" value="↓"><img src="../img/s.png"></button>
                <button id="rbtn" class="menu_button" type="button" value="→"><img src="../img/e.png"></button>
                <button id="reset" class="menu_button" type="button" value="RESET"><ruby>RESET<rt>りせっと</rt></ruby></button>
            </td>
        </tr>
        <tr>
            <td>
                <span id="scoreText"></span>
            </td>
        </tr>
    </table>
    <div id="successImage"></div>
    <div id="mainScreen"></div>
    <!-- JavaScript -->
    <script type="text/javascript" src="./2048Puzzle.js"></script>
    <script type="text/javascript" src="./2048PuzzleData.js"></script>

</body>
</html>
