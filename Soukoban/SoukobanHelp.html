                <ruby>指定<rt>してい</rt></ruby>の<ruby>場所<rt>ばしょ</rt></ruby>にすべての<ruby>荷物<rt>にもつ</rt></ruby>を<ruby>運<rt>はこ</rt></ruby>べば、クリアです。<br>
