<!DOCTYPE html>
<html>
    <head>
        <base target="_top">
        <meta name="viewport" content="width=device-width">
        <meta charset="UTF-8">
        <title>倉庫番</title>
        <!-- CSS -->
        <link type="text/css" rel="stylesheet" href="./Soukoban.css">
    </head>
<body>
    <table id="main_table">
        <tr>
            <td id="title">
                <span id="title_line">
                    【<ruby>倉庫番<rt>そうこばん</rt></ruby>】
                </span>
                <br><br>
                <span>
                    <button class="transition_button" onclick='window.open("./SoukobanHelp.html")'><ruby>遊<rt>あそ</rt></ruby>び<ruby>方<rt>かた</rt></ruby></button>
                </span>
            </td>
        </tr>
        <tr>
            <td id="number">
                <label>&emsp;<ruby>問題<rt>もんだい</rt></ruby>を<ruby>選<rt>えら</rt></ruby>んでください。
                    <select id="dataNumber">
                        <option value="1" selected>1</option>
                    </select>
                </label>
            </td>
        </tr>
    </table>
    <div id="successImage"></div>
    <div id="mainScreen"></div>

        <!-- 操作ボタンを画面下部に固定する要素として分離 -->
    <div class="button_container">
        <button id="lbtn" class="menu_button" type="button" value="←"><img src="../img/w.png"></button>
        <button id="ubtn" class="menu_button" type="button" value="↑"><img src="../img/n.png"></button>
        <button id="dbtn" class="menu_button" type="button" value="↓"><img src="../img/s.png"></button>
        <button id="rbtn" class="menu_button" type="button" value="→"><img src="../img/e.png"></button>
        <button id="reset" class="menu_button" type="button" value="RESET"><ruby>RESET<rt>りせっと</rt></ruby></button>
    </div>

    <!-- JavaScript -->
    <script type="text/javascript" src="./SoukobanData.js"></script>
    <script type="text/javascript" src="./Soukoban.js"></script>

</body>
</html>
