<!DOCTYPE html>
<html>
    <head>
        <base target="_top">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta charset="UTF-8">
        <title>数字シューティング</title>
        <!-- CSS -->
        <link type="text/css" rel="stylesheet" href="./Shooting.css">
    </head>
    <body>
        <table id="main_table">
            <tr>
                <td id="title">
                    <span id="checkmap"></span>
                    <span id="title_line">
                        【数字シューティング】
                    </span>
                    <br><br>
                    <span>
                        <!-- <button class="transition_button" onclick='window.open("./Shootting.html")'><ruby>遊<rt>あそ</rt></ruby>び<ruby>方<rt>かた</rt></ruby></button> -->
                        キーボードの数字キー（0〜9）を押して<br>降ってくる数字を撃ち落とそう！
                    </span>
                </td>
            </tr>
            <tr>
                <td>
                    <button id="reset" class="menu_button" type="button" value="RESET"><ruby>RESET<rt>りせっと</rt></ruby></button>
                </td>
            </tr>
        </table>
        <canvas id="mainScreen" width="750" height="800"></canvas>
        <!-- mainScreen Canvas の直下に追加 -->
        <div id="touch-keyboard">
            <div class="key-row">
                <button class="num-key" data-key="7">7</button>
                <button class="num-key" data-key="8">8</button>
                <button class="num-key" data-key="9">9</button>
            </div>
            <div class="key-row">
                <button class="num-key" data-key="4">4</button>
                <button class="num-key" data-key="5">5</button>
                <button class="num-key" data-key="6">6</button>
            </div>
            <div class="key-row">
                <button class="num-key" data-key="1">1</button>
                <button class="num-key" data-key="2">2</button>
                <button class="num-key" data-key="3">3</button>
            </div>
            <div class="key-row">
                <button class="num-key key-zero" data-key="0">0</button>
            </div>
        </div>
        <!-- JavaScript -->
        <script type="text/javascript" src="./Shooting.js"></script>
    </body>
</html>
